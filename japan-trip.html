function sortOpenFirst(list) {

  });
}

function mergeShare(p) {
  Object.entries(p.checks || {}).forEach(([k, v]) => { if (v) state.checks[k] = true; });
  ["notes", "dayNotes"].forEach(bucket => {
    Object.entries(p[bucket] || {}).forEach(([k, v]) => {
      const incoming = asItems(v);
      if (!incoming.length) return;
      const cur = asItems(state[bucket][k]);
      incoming.forEach(x => {
        const hit = cur.find(e => e.text === x.text);
        if (!hit) cur.push(x);
        else if (x.done) hit.done = true;
      });
      state[bucket][k] = cur;
    });
  });
  (p.extra || []).forEach(x => {
    const hit = state.extra.find(e => e.text === x.text);
    if (!hit) state.extra.push(x);
    else if (x.done) hit.done = true;
  });
  if (p.fx && p.fx.rate) state.fx.rate = p.fx.rate;
  (p.expenses || []).forEach(x => {
    if (!x || !x.id) return;
    const hit = state.expenses.find(e => e.id === x.id);
    if (!hit) state.expenses.push(x);
    else Object.assign(hit, x);
  });
  Object.entries(p.dayMemo || {}).forEach(([k, v]) => {
    if (typeof v === "string" && v.trim()) state.dayMemo[k] = v;

}

function money(n, cur) {

function bindFx(root) {

  const redraw = () => { save(state); if (document.getElementById("view-today").classList.contains("on")) renderToday(); if (document.getElementById("view-kit").classList.contains("on")) renderKit(); };
  box.querySelector("#fx-flip").onclick = () => { state.fx.side = state.fx.side === "jpy" ? "usd" : "jpy"; state.fx.raw = state.fx.side === "jpy" ? "1000" : "20"; redraw(); };
  box.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => { state.fx.raw = b.dataset.chip; redraw(); });

    if (k === "AC") state.fx.raw = "0";
    else if (k === "←") state.fx.raw = state.fx.raw.slice(0, -1) || "0";
    else {
      if (state.fx.raw === "0") state.fx.raw = "";
      if (state.fx.raw.length < 9) state.fx.raw += k;
    }

  box.querySelectorAll("[data-spread]").forEach(b => b.onclick = () => { state.fx.spread = Number(b.dataset.spread); redraw(); });

  rate.onchange = () => { const n = parseFloat(rate.value); if (n > 0) state.fx.rate = Math.round(n * 100) / 100; redraw(); };
}

function fmt(iso) {

function todayISO() {

function daysUntil(iso) {

  el.innerHTML = `<div class="card"><h2>Day book</h2><p class="meta">Add a line, check it off. Finished lines sink to the bottom. Tap <strong>Details</strong> on any option for the full write-up.</p>
    ${DAYS.map(day => {
      const items = asItems(state.dayNotes[day.d]);
      state.dayNotes[day.d] = items;
      return `
      <div class="day">
        <div class="when">${fmt(day.d).replace(",", "")}</div>
        <div>
          <span class="tag">${day.t}</span>
          <strong>${day.title}</strong>
          <div class="meta">${day.body}</div>
          ${checkRows(items, "data-dayitem")}
          <div class="row" style="margin-top:8px">

  </div>
  <div id="detail-modal" style="display:none;position:fixed;inset:0;background:rgba(18,16,14,.92);z-index:100;overflow:auto;padding:16px;">
    <div class="card" style="max-width:520px;margin:40px auto;">

        <button type="button" class="go" id="detail-close">Close</button>
      </div>
      <div id="detail-body" style="margin-top:12px"></div>
    </div>
  </div>`;

  el.querySelectorAll("[data-dayitem]").forEach(box => {
    const day = box.closest(".day").querySelector("[data-dayadd]").dataset.dayadd;
    box.onchange = () => {
      state.dayNotes[day][box.dataset.dayitem].done = box.checked;
      save(state);
      renderPlan();
    };
  });
  el.querySelectorAll("[data-daybtn]").forEach(btn => btn.onclick = () => {
    const input = el.querySelector(`[data-dayadd="${btn.dataset.daybtn}"]`);
    const v = input.value.trim();
    if (!v) return;
    state.dayNotes[btn.dataset.daybtn] = asItems(state.dayNotes[btn.dataset.daybtn]);
    state.dayNotes[btn.dataset.daybtn].push({ text: v, done: false });
    save(state);
    renderPlan();
  });

  // Details modal
  const modal = el.querySelector("#detail-modal");
  const body = el.querySelector("#detail-body");
  const title = el.querySelector("#detail-title");
  el.querySelectorAll("[data-detail-idx]").forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      const dayEl = btn.closest(".day");
      const dayKey = dayEl.querySelector("[data-dayadd]").dataset.dayadd;
      const idx = Number(btn.dataset.detailIdx);
      const items = asItems(state.dayNotes[dayKey]);
      const key = items[idx] ? items[idx].text : "";
      title.textContent = key.length > 48 ? key.slice(0, 48) + "…" : key || "Details";
      body.innerHTML = DETAILS[key] || `<p>No extra details stored for this note yet. You can still use it as a checklist item.</p><p class="small">Add your own notes in the line below if needed.</p>`;
      modal.style.display = "block";
    };
  });
  el.querySelector("#detail-close").onclick = () => { modal.style.display = "none"; };
  modal.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };
}

const LEGS = [
  { from: "nrt", to: "shinjuku", label: "Narita → Cabin Shinjuku", note: "N’EX. Transit mode, not a taxi." },
  { from: "shinjuku", to: "kyoto", label: "Shinjuku → KANSEI Kyoto", note: "Shinkansen. Hachijo exit on the pin." },
  { from: "kyoto", to: "osaka", label: "Kyoto → Dotonbori", note: "Special rapid, then the Namba exit." },
  { from: "osaka", to: "hiroshima", label: "Namba → Mitsui Garden", note: "Shin-Osaka, then the tram or a walk." },
  { from: "hiroshima", to: "hakone", label: "Hiroshima → Hakone Hotel", note: "Via Odawara or similar. Lake Ashi hotel." },
  { from: "hakone", to: "ueno", label: "Hakone → Sunroute Stellar Ueno", note: "Train to Tokyo area then Ueno. Station hotel." },
  { from: "ueno", to: "nrt", label: "Ueno → Narita", note: "Skyliner. Leave around 13:40." }
];
function gQuery(b) {
  return encodeURIComponent(b.name + (b.address ? ", " + b.address : ", " + b.city));
}
function gPlace(b) {
  return "https://www.google.com/maps/search/?api=1&query=" + gQuery(b);
}
function gDir(dest, origin) {
  let url = "https://www.google.com/maps/dir/?api=1&travelmode=transit&destination=" + gQuery(dest);
  if (origin) url += "&origin=" + gQuery(origin);
  return url;
}
function gEmbed(query, z) {
  return "https://maps.google.com/maps?q=" + encodeURIComponent(query) + "&z=" + (z || 15) + "&output=embed&hl=en";
}
function gRouteEmbed() {
  const rest = BASES.slice(1).map(b => b.pin.join(",")).join("+to:");
  return "https://maps.google.com/maps?saddr=" + BASES[0].pin.join(",") + "&daddr=" + rest + "&output=embed&hl=en";
}
function showOnMap(query, z) {
  const frame = document.getElementById("gmap");
  if (frame) frame.src = query ? gEmbed(query, z) : gRouteEmbed();
}
function renderMap() {
  const frame = document.getElementById("gmap");
  if (frame && (!frame.src || frame.src === "about:blank" || frame.src.endsWith("about:blank"))) showOnMap();
  document.getElementById("map-list").innerHTML = `
    <div class="card"><h2>Google Maps</h2>
      <div class="route">${BASES.map((b,i) => `<button type="button" data-show="${b.id}"><b>${i+1}</b><span>${b.city.split("·")[0].trim()}</span></button>`).join('<i class="leg"></i>')}</div>
      <p class="small">Tap a stop to put that hotel on the map above. The full route loads first.</p>
      <button class="ghost" type="button" id="show-route">Whole route</button>
    </div>
    <div class="card"><h2>Legs in the app</h2><p class="meta">Transit mode. Opens the Google Maps app if it is installed.</p>
      ${LEGS.map(leg => `<p style="margin:10px 0"><a class="go" target="_blank" rel="noopener" href="${gDir(BASES.find(b => b.id === leg.to), BASES.find(b => b.id === leg.from))}">${leg.label}</a><span class="meta" style="display:block">${leg.note}</span></p>`).join("")}
    </div>` + BASES.map(b => `
    <div class="card">
      <div class="tag">${b.city}</div>
      <h3>${b.name}</h3>
      <p class="meta">${b.stay}</p>
      <div class="row">
        <button class="ghost" type="button" data-show="${b.id}">Show on map</button>
        <a class="go" target="_blank" rel="noopener" href="${gPlace(b)}">Open app</a>
        <a class="ghost" target="_blank" rel="noopener" href="${gDir(b)}">Transit to hotel</a>
      </div>
    </div>`).join("");
  document.getElementById("map-list").querySelectorAll("[data-show]").forEach(btn => {
    btn.onclick = () => {
      const b = BASES.find(x => x.id === btn.dataset.show);
      showOnMap(b.name + (b.address ? ", " + b.address : ""), 16);
      document.getElementById("gmap").scrollIntoView({ behavior: "smooth", block: "start" });
    };
  });
  const route = document.getElementById("show-route");
  if (route) route.onclick = () => showOnMap();
}

function renderPlaces() {
  const el = document.getElementById("view-places");
  const current = state.place || "shinjuku";
  const b = BASES.find(x => x.id === current) || BASES[1];
  el.innerHTML = `
    <div class="place-switch">
      ${BASES.map(p => `<button class="pill ${p.id === b.id ? "on" : ""}" data-p="${p.id}">${p.city.split("·")[0].trim()}</button>`).join("")}
    </div>
    <div class="card">
      <div class="tag gold">${b.stay}</div>
      <h2>${b.name}</h2>
      <p class="meta">${b.address || b.city}</p>
      <div class="row">
        <a class="go" target="_blank" rel="noopener" href="${gPlace(b)}">Open in Google Maps</a>
        <a class="ghost" target="_blank" rel="noopener" href="${gDir(b)}">Transit from here</a>
      </div>
      <h3>History of the ground</h3>
      <p>${b.history}</p>
      <h3>Advisor</h3>
      <p>${b.advisor}</p>
      <h3>Do this, not everything</h3>
      <ul class="clean">${b.recs.map(r => `<li>${r}</li>`).join("")}</ul>
      <h3>Money on the ground</h3>
      <p>${b.money}</p>
      <h3>Your list</h3>
      ${checkRows(asItems(state.notes[b.id]), "data-noteitem")}
      <div class="row" style="margin-top:8px">
        <input type="text" id="place-add" placeholder="Add a line for ${esc(b.city)}" />
        <button class="go" type="button" id="place-add-btn">Add</button>
      </div>
    </div>`;
  el.querySelectorAll("[data-p]").forEach(btn => btn.onclick = () => { state.place = btn.dataset.p; save(state); renderPlaces(); });
  el.querySelectorAll("[data-noteitem]").forEach(box => box.onchange = () => {
    state.notes[b.id] = asItems(state.notes[b.id]);
    state.notes[b.id][box.dataset.noteitem].done = box.checked;
    save(state);
    renderPlaces();
  });
  document.getElementById("place-add-btn").onclick = () => {
    const v = document.getElementById("place-add").value.trim();
    if (!v) return;
    state.notes[b.id] = asItems(state.notes[b.id]);
    state.notes[b.id].push({ text: v, done: false });
    save(state);
    renderPlaces();
  };
}

function packingSection() {
  const cats = [...new Set(PACKING.map(p => p.cat))];
  return cats.map(cat => {
    const items = PACKING.filter(p => p.cat === cat);
    const open = items.filter(p => !state.checks[p.id]).length;
    const rows = items.map(p => {
      const checked = state.checks[p.id] ? "checked" : "";
      return `<label class="check"><input type="checkbox" data-c="${p.id}" ${checked}/><span>${p.text}<span class="meta" style="display:block">${p.note}</span></span></label>`;
    }).join("");
    return `<div class="card"><h3>${cat}</h3><p class="meta">${open} open</p>${rows}</div>`;
  }).join("");
}
function renderKit() {
  const el = document.getElementById("view-kit");
  el.innerHTML = `
    ${fxCard()}
    ${bothCard()}
    ${["pre", "exit", "post"].map(phase => {
      const label = phase === "pre" ? "Pre-trip" : phase === "exit" ? "Leaving Japan" : "Post-landing";
      const items = MINDERS.filter(m => m.phase === phase).slice().sort((a, b) => Number(!!state.checks[a.id]) - Number(!!state.checks[b.id]));
      const open = items.filter(m => !state.checks[m.id]).length;
      return `<div class="card"><h2>${label}</h2><p class="meta">${open} open · send an update so the other phone sees the check</p>${items.map(minderRow).join("")}</div>`;
    }).join("")}
    <div class="card"><h2>Packing checklist</h2><p class="meta">Nov 17–Dec 8 · cool autumn layers · multi-city. Checks save locally and sync via Kit → Send update.</p></div>
    ${packingSection()}
    <div class="card">
      <h3>Your own</h3>
      <p class="meta">Checked lines sink to the bottom.</p>
      ${checkRows(state.extra, "data-e")}
      <div class="row" style="margin-top:10px">
        <input type="text" id="new-rem" placeholder="Add a reminder" />
        <button class="go" id="add-rem">Add</button>
      </div>
    </div>
    <div class="card">
      <h3>Carry</h3>
      <ul class="clean">
        <li>Passport, the AA and hotel confirmations offline</li>
        <li>One card that works abroad, and ¥20,000 cash to start — IC will not cover every counter</li>
        <li>Prescriptions in original bottles. A compact umbrella. Shoes you can remove.</li>
        <li>Luggage: forward the big bag twice. Ride the shinkansen with a day bag.</li>
      </ul>
      <p class="small">Hotel subtotal on the note is about $2,660 before taxes and fees. Kyoto city accommodation tax is charged on top of the room and is already often inside the plan price — read the KANSEI receipt. Partner air is sunk at $1,161.73.</p>
      <button class="ghost" id="export">Copy notes</button>
    </div>`;
  el.querySelectorAll("[data-e]").forEach(box => box.onchange = () => {
    state.extra[box.dataset.e].done = box.checked;
    save(state);
    renderKit();
  });
  document.getElementById("add-rem").onclick = () => {
    const v = document.getElementById("new-rem").value.trim();
    if (!v) return;
    state.extra.push({ text: v, done: false });
    save(state); renderKit();
  };
  document.getElementById("export").onclick = async () => {
    const lines = ["Honshu notes",
      ...Object.entries(state.notes).map(([k, v]) => k + ": " + asItems(v).map(x => (x.done ? "[x] " : "[ ] ") + x.text).join("; ")),
      ...Object.entries(state.dayNotes).map(([k, v]) => k + ": " + asItems(v).map(x => (x.done ? "[x] " : "[ ] ") + x.text).join("; "))];
    try { await navigator.clipboard.writeText(lines.join("\n")); document.getElementById("export").textContent = "Copied"; }
    catch { alert(lines.join("\n")); }
  };
  bindFx(el);
  bindChecks(el);
  bindBoth(el);
}

function uid() { return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function numOrNull(v) {
  if (v === "" || v == null) return null;
  const n = Number(String(v).replace(/,/g, ""));
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : null;
}
function moneyPlain(n, cur) {
  if (n == null) return "—";
  return cur === "USD" ? "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "¥" + Math.round(n).toLocaleString("en-US");
}
function toUSD(n, cur) {
  if (n == null) return 0;
  const rate = state.fx.rate || 158.1;
  return cur === "USD" ? n : n / rate;
}
function spendTotals() {
  let est = 0, act = 0;
  state.expenses.forEach(e => {
    if (e.est != null) est += toUSD(e.est, e.cur);
    if (e.act != null) act += toUSD(e.act, e.cur);
  });
  return { est, act, var: act - est };
}
function dayList() {
  const set = new Set(DAYS.map(d => d.d));
  state.expenses.forEach(e => { if (e.date) set.add(e.date); });
  return [...set].sort();
}
function renderSpend() {
  const el = document.getElementById("view-spend");
  const t = spendTotals();
  const days = dayList().filter(d => state.expenses.some(e => e.date === d) || (state.dayMemo[d] && state.dayMemo[d].trim()));
  const byDay = days.map(d => {
    const rows = state.expenses.filter(e => e.date === d);
    const byCat = CATS.map(c => {
      const items = rows.filter(e => e.cat === c.id);
      if (!items.length) return "";
      const est = items.reduce((s, e) => s + (e.est != null ? toUSD(e.est, e.cur) : 0), 0);
      const act = items.reduce((s, e) => s + (e.act != null ? toUSD(e.act, e.cur) : 0), 0);
      return `<div class="exp-row">
        <div class="top"><span class="tag gold">${c.label}</span><span class="amt">${moneyPlain(act, "USD")}</span></div>
        <p class="small">est ${moneyPlain(est, "USD")} · ${act - est >= 0 ? "+" : ""}${(act - est).toFixed(2)}</p>
        ${items.map(e => `<p style="margin:4px 0 0">${esc(e.desc || "(no label)")} · est ${moneyPlain(e.est, e.cur)} · act ${moneyPlain(e.act, e.cur)}${e.note ? `<span class="small" style="display:block">${esc(e.note)}</span>` : ""} <button class="ghost" data-del="${e.id}" style="padding:4px 8px;margin-top:4px">remove</button></p>`).join("")}
      </div>`;
    }).join("");
    const memo = state.dayMemo[d] || "";
    return `<div class="card">
      <h3>${fmt(d)}</h3>
      ${byCat || `<p class="small">No entries yet.</p>`}
      <label class="small" style="display:block;margin-top:8px">Day note</label>
      <textarea class="memo" data-memo="${d}" placeholder="Personal note for this day">${esc(memo)}</textarea>
    </div>`;
  }).join("");
  const today = todayISO();
  el.innerHTML = `
    <div class="statgrid">
      <div class="stat"><b>${moneyPlain(t.est, "USD")}</b><span>estimate</span></div>
      <div class="stat"><b>${moneyPlain(t.act, "USD")}</b><span>actual</span></div>
      <div class="stat"><b class="${t.var > 0 ? "var-neg" : "var-pos"}">${t.var >= 0 ? "+" : ""}${t.var.toFixed(2)}</b><span>variance USD</span></div>
      <div class="stat"><b>${state.expenses.length}</b><span>entries</span></div>
    </div>
    <p class="small" style="margin:0 4px 8px">USD totals use the Kit rate (¥${(state.fx.rate || 158.1).toFixed(2)}). JPY lines stay in yen on the entry.</p>
    <div class="card exp-form">
      <div class="tag gold">Add</div>
      <h2>Entry</h2>
      <label>Date</label>
      <input type="date" id="ex-date" value="${today}" />
      <div class="pair">
        <div><label>Category</label>
          <select id="ex-cat">${CATS.map(c => `<option value="${c.id}">${c.label}</option>`).join("")}</select></div>
        <div><label>Currency</label>
          <select id="ex-cur"><option value="JPY">JPY</option><option value="USD">USD</option></select></div>
      </div>
      <label>What</label>
      <input type="text" id="ex-desc" placeholder="ramen, N’EX, temple ticket…" />
      <div class="pair">
        <div><label>Estimate</label><input type="text" id="ex-est" inputmode="decimal" placeholder="0" /></div>
        <div><label>Actual</label><input type="text" id="ex-act" inputmode="decimal" placeholder="0" /></div>
      </div>
      <label>Personal note</label>
      <textarea id="ex-note" placeholder="cash, who paid, why it ran over…"></textarea>
      <button class="go" id="ex-add" style="margin-top:10px;width:100%">Add entry</button>
    </div>
    ${byDay || `<div class="card"><p class="small">No days with entries yet. Add one above.</p></div>`}
    <div class="card">
      <h3>Export</h3>
      <p class="meta">Post-trip report: itinerary, minders, every expense with estimate vs actual, daily category totals, and personal notes.</p>
      <div class="row">
        <button class="go" id="ex-html">Download report</button>
        <button class="ghost" id="ex-json">Download JSON</button>
      </div>
    </div>`;
  bindSpend(el);
}
function bindSpend(el) {
  el.querySelector("#ex-add").onclick = () => {
    const desc = el.querySelector("#ex-desc").value.trim();
    const est = numOrNull(el.querySelector("#ex-est").value);
    const act = numOrNull(el.querySelector("#ex-act").value);
    const note = el.querySelector("#ex-note").value.trim();
    if (!desc && est == null && act == null && !note) return;
    state.expenses.push({
      id: uid(),
      date: el.querySelector("#ex-date").value || todayISO(),
      cat: el.querySelector("#ex-cat").value,
      cur: el.querySelector("#ex-cur").value,
      desc, est, act, note,
      who: state.who,
      at: new Date().toISOString()
    });
    save(state);
    renderSpend();
  };
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    state.expenses = state.expenses.filter(e => e.id !== b.dataset.del);
    save(state);
    renderSpend();
  });
  el.querySelectorAll("[data-memo]").forEach(box => {
    box.onblur = () => {
      state.dayMemo[box.dataset.memo] = box.value;
      save(state);
    };
  });
  el.querySelector("#ex-html").onclick = () => downloadReport("html");
  el.querySelector("#ex-json").onclick = () => downloadReport("json");
}
function reportHTML() {
  const t = spendTotals();
  const days = dayList().filter(d => state.expenses.some(e => e.date === d) || (state.dayMemo[d] && state.dayMemo[d].trim()));
  const dayBlocks = days.map(d => {
    const rows = state.expenses.filter(e => e.date === d);
    const cats = CATS.map(c => {
      const items = rows.filter(e => e.cat === c.id);
      if (!items.length) return "";
      const lines = items.map(e => `<tr><td>${esc(e.desc || "")}</td><td>${esc(catLabel(e.cat))}</td><td>${moneyPlain(e.est, e.cur)}</td><td>${moneyPlain(e.act, e.cur)}</td><td>${esc(e.note || "")}</td><td>${esc(e.who || "")}</td></tr>`).join("");
      return lines;
    }).join("");
    const memo = state.dayMemo[d] ? `<p><em>Day note:</em> ${esc(state.dayMemo[d])}</p>` : "";
    return `<h3>${fmt(d)}</h3>${memo}<table><thead><tr><th>What</th><th>Category</th><th>Estimate</th><th>Actual</th><th>Note</th><th>Who</th></tr></thead><tbody>${cats || "<tr><td colspan='6'>No entries</td></tr>"}</tbody></table>`;
  }).join("");
  const catTotals = CATS.map(c => {
    const items = state.expenses.filter(e => e.cat === c.id);
    const est = items.reduce((s, e) => s + (e.est != null ? toUSD(e.est, e.cur) : 0), 0);
    const act = items.reduce((s, e) => s + (e.act != null ? toUSD(e.act, e.cur) : 0), 0);
    return `<tr><td>${c.label}</td><td>${moneyPlain(est, "USD")}</td><td>${moneyPlain(act, "USD")}</td><td>${(act - est).toFixed(2)}</td></tr>`;
  }).join("");
  const minders = MINDERS.map(m => `<li>${state.checks[m.id] ? "[x]" : "[ ]"} ${esc(m.text)} — ${esc(m.why)}</li>`).join("");
  const plan = DAYS.map(d => `<li><strong>${fmt(d.d)} · ${esc(d.t)}</strong> — ${esc(d.title)}. ${esc(d.body)}</li>`).join("");
  const hotels = BASES.map(b => `<li><strong>${esc(b.name)}</strong> (${esc(b.city)}) — ${esc(b.stay)}${b.address ? ". " + esc(b.address) : ""}</li>`).join("");
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Honshu report · Nov 17–Dec 8 2026</title>
<style>body{font:16px/1.45 -apple-system,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#1b140c;background:#f7f1e6}h1,h2,h3{font-weight:560}table{width:100%;border-collapse:collapse;margin:8px 0 18px}th,td{border-bottom:1px solid #e4d8c4;padding:6px 4px;text-align:left;vertical-align:top;font-size:14px}th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#6b5e4e}</style></head><body>
<h1>Honshu · 17 Nov – 8 Dec 2026</h1>
<p>${esc(TRIP.names)}. AA ${esc(TRIP.confirm.aa)} / JL ${esc(TRIP.confirm.jl)}. Partner air $${TRIP.confirm.fare.toFixed(2)}. Exported ${new Date().toISOString().slice(0, 16).replace("T", " ")}.</p>
<h2>Flights</h2>
<ul>${TRIP.flights.map(f => `<li>${esc(f.code)} (${esc(f.op)}) ${esc(f.date)} ${esc(f.from)} → ${esc(f.to)} ${esc(f.cabin)}. ${esc(f.bag)}</li>`).join("")}</ul>
<h2>Bases</h2><ul>${hotels}</ul>
<h2>Day plan</h2><ul>${plan}</ul>
<h2>Spend</h2>
<p>Estimate ${moneyPlain(t.est, "USD")} · Actual ${moneyPlain(t.act, "USD")} · Variance ${t.var >= 0 ? "+" : ""}${t.var.toFixed(2)} USD. Rate used ¥${(state.fx.rate || 158.1).toFixed(2)} per dollar.</p>
<table><thead><tr><th>Category</th><th>Estimate</th><th>Actual</th><th>Variance</th></tr></thead><tbody>${catTotals}</tbody></table>
${dayBlocks || "<p>No expense entries.</p>"}
<h2>Minders</h2><ul>${minders}</ul>
<p class="small">Hotels on the original note about $2,660 before tax. This report is the working record; confirm receipts against the card posts.</p>
</body></html>`;
}
function downloadReport(kind) {
  const stamp = new Date().toISOString().slice(0, 10);
  if (kind === "json") {
    const blob = new Blob([JSON.stringify({
      trip: TRIP, bases: BASES.map(b => ({ id: b.id, name: b.name, stay: b.stay })),
      days: DAYS, expenses: state.expenses, dayMemo: state.dayMemo,
      checks: state.checks, notes: state.notes, dayNotes: state.dayNotes, extra: state.extra,
      fx: state.fx, exported: new Date().toISOString()
    }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `honshu-records-${stamp}.json`;
    a.click();
    return;
  }
  const blob = new Blob([reportHTML()], { type: "text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `honshu-report-${stamp}.html`;
  a.click();
}

function show(v) {
  document.querySelectorAll(".view").forEach(s => s.classList.remove("on"));
  document.getElementById("view-" + v).classList.add("on");
  document.querySelectorAll("nav.dock button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if (v === "map") renderMap();
  if (v === "today") renderToday();
  if (v === "spend") renderSpend();
}
document.querySelectorAll("nav.dock button").forEach(b => b.onclick = () => show(b.dataset.v));
document.querySelector(".kicker").textContent = (state.who || "Steven") + " · shared with " + ((state.who || "Steven") === "Steven" ? "Thanh" : "Steven");
renderToday(); renderPlan(); renderPlaces(); renderKit(); renderSpend();
</script>
</body>
</html>
